<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Portal Previous Releases</title>
  <meta name="description" content="Previous LAN Portal installer releases and checksums.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand-row">
      <p class="kicker">Ignyos</p>
      <h1>LAN Portal</h1>
    </div>
    <p class="tagline">Previous release history and checksums for LAN Portal.</p>
  </header>

  <main class="layout">
    <section class="panel reveal delay-1">
      <h2>Previous Releases</h2>
      <p id="history-status" class="status-line">Loading release history...</p>
      <p class="mono small">Use these links to fetch installer binaries, checksums, and zip packages from earlier builds.</p>
    </section>

    <section class="panel reveal delay-2">
      <div id="history-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="../index.html" class="footer-link">Back to home page</a>
  </footer>

  <script>
    (function () {
      const statusEl = document.getElementById('history-status');
      const listEl = document.getElementById('history-list');

      function isDevHost() {
        const host = window.location.hostname || "";
        return host.indexOf('dev') !== -1 || host.indexOf('test') !== -1 || host.indexOf('localhost') !== -1;
      }

      function formatVersionLabel(version, devHost) {
        if (!version) {
          return 'unknown';
        }

        const normalized = String(version).trim();
        const match = normalized.match(/^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$/);
        if (!match) {
          return normalized;
        }

        const [, major, minor, patch, build] = match;
        if (devHost) {
          return `${major}.${minor}.${patch}`;
        }

        return `${major}.${minor}.${patch}.0`;
      }

      function isVisibleRelease(entry, devHost) {
        if (!entry || !entry.version) {
          return false;
        }

        if (devHost) {
          return true;
        }

        const parts = String(entry.version).split('.');
        return parts.length < 4 || parts[3] === '0';
      }

      async function loadHistory() {
        try {
          const response = await fetch('./history.json', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          const history = await response.json();
          const devHost = isDevHost();
          const releases = (history || []).filter((entry) => isVisibleRelease(entry, devHost)).sort((a, b) => {
            const av = a.version || '';
            const bv = b.version || '';
            return bv.localeCompare(av, undefined, { numeric: true, sensitivity: 'base' });
          });

          if (!releases.length) {
            statusEl.textContent = devHost ? 'No releases are available yet.' : 'No production releases are available yet.';
            return;
          }

          const fragments = releases.map((entry) => {
            const publishedAt = entry.publishedAt ? new Date(entry.publishedAt).toLocaleString() : 'unknown';
            const versionLabel = formatVersionLabel(entry.version, devHost);
            return `
              <article class="download-card">
                <h3>${versionLabel}</h3>
                <p class="mono small">Published: ${publishedAt}</p>
                <p><a href="${entry.installerUrl}" target="_blank" rel="noopener">Installer</a></p>
                <p><a href="${entry.checksumUrl}" target="_blank" rel="noopener">Checksum (.sha256)</a></p>
                ${entry.zipUrl ? `<p><a href="${entry.zipUrl}" target="_blank" rel="noopener">Zip package</a></p>` : ''}
              </article>
            `;
          });

          listEl.innerHTML = fragments.join('');
          statusEl.textContent = devHost ? 'All releases' : 'Production releases';
        } catch (error) {
          statusEl.textContent = 'Release history unavailable: ' + error.message;
        }
      }

      loadHistory();
    })();
  </script>
</body>
</html>
