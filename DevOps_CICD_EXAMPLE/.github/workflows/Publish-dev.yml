name: Publish-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment source (./docs)
        shell: pwsh
        run: |
          $buildScriptCandidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'Build.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'build.ps1')
          )
          $buildScript = $buildScriptCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $buildScript) {
            throw "Required build script not found. Checked: $($buildScriptCandidates -join ', ')"
          }

          & $buildScript

      - name: Set dev CNAME in source output (docs/CNAME)
        shell: pwsh
        run: |
          $docsDir = Join-Path $env:GITHUB_WORKSPACE 'docs'
          $cnamePath = Join-Path $docsDir 'CNAME'

          if (-not (Test-Path -LiteralPath $docsDir)) {
            throw "Required directory not found: $docsDir"
          }

          Set-Content -LiteralPath $cnamePath -Value 'test-dev.ignyos.com' -NoNewline -Encoding utf8

      - name: Publish source ./docs to external repo root
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEV_PAGES_TOKEN }}
          external_repository: ${{ secrets.DEV_PAGES_REPO }}
          publish_branch: main
          publish_dir: ${{ github.workspace }}/docs
          force_orphan: true

