name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_host:
        description: 'Include Host publish artifact (Windows executable payload)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  release-artifacts:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      CONFIGURATION: Release
      INCLUDE_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.include_host || 'false' }}
      PAGES_BASE_URL: https://lanportal.ignyos.com
      PAGES_SOURCE_BRANCH: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Ignyos.LanPortal.sln

      - name: Publish API
        run: >
          dotnet publish
          Ignyos.LanPortal.Api/Ignyos.LanPortal.Api.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output artifacts/release/api

      - name: Publish Web
        run: >
          dotnet publish
          Ignyos.LanPortal.Web/Ignyos.LanPortal.Web.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output artifacts/release/web

      - name: Publish Host (optional)
        if: env.INCLUDE_HOST == 'true'
        run: >
          dotnet publish
          Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/release/host

      - name: Build installer staging payload (Stage 3)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release/staging/app/api -Force | Out-Null
          New-Item -ItemType Directory -Path artifacts/release/staging/app/web -Force | Out-Null
          New-Item -ItemType Directory -Path artifacts/release/staging/app/host -Force | Out-Null

          dotnet publish Ignyos.LanPortal.Api/Ignyos.LanPortal.Api.csproj `
            --configuration $env:CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/release/staging/app/api

          dotnet publish Ignyos.LanPortal.Web/Ignyos.LanPortal.Web.csproj `
            --configuration $env:CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/release/staging/app/web

          dotnet publish Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj `
            --configuration $env:CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/release/staging/app/host

          Copy-Item installer/templates/Launch-LanPortal.ps1 artifacts/release/staging/app/Launch-LanPortal.ps1
          Copy-Item installer/templates/Open-LanPortal-Admin.cmd artifacts/release/staging/app/Open-LanPortal-Admin.cmd
          Copy-Item installer/templates/README-QA.txt artifacts/release/staging/app/README-QA.txt

      - name: Install Inno Setup compiler
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            choco install innosetup --no-progress -y
            $env:PATH += ';C:\Program Files (x86)\Inno Setup 6;C:\Program Files\Inno Setup 6'
          }

          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            throw 'Inno Setup compiler (iscc.exe) could not be resolved after install.'
          }

      - name: Build installer executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          iscc.exe installer/Ignyos.LanPortal.Dev.iss "/DMyAppVersion=$version" "/DStagingRoot=$env:GITHUB_WORKSPACE/artifacts/release/staging" "/DInstallerOutRoot=$env:GITHUB_WORKSPACE/artifacts/release/package"

          $installer = Get-ChildItem -Path artifacts/release/package -Filter "Ignyos-LanPortal-Dev-$version.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Installer output not found for version $version."
          }

          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Path (Join-Path $installer.DirectoryName "$($installer.Name).sha256")

      - name: Generate update manifest (Stage 4)
        if: startsWith(github.ref, 'refs/tags/')
        id: update_manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          $isTestChannel = $version -match '-test(\.|$)'
          $channel = if ($isTestChannel) { 'test' } else { 'production' }

          $installerName = "Ignyos-LanPortal-Dev-$version.exe"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/package"
          $installerPath = Join-Path $packageRoot $installerName
          $installerHashPath = "$installerPath.sha256"

          if (-not (Test-Path $installerPath)) {
            throw "Installer not found at $installerPath"
          }

          if (-not (Test-Path $installerHashPath)) {
            throw "Installer checksum file not found at $installerHashPath"
          }

          $installerHashLine = (Get-Content -Path $installerHashPath | Select-Object -First 1).Trim()
          $installerHash = ($installerHashLine -split '\s+')[0]
          if ([string]::IsNullOrWhiteSpace($installerHash)) {
            throw "Could not parse installer checksum from $installerHashPath"
          }

          $coreVersion = ($version -split '-', 2)[0]
          $coreParts = $coreVersion -split '\.'
          if ($coreParts.Length -lt 2) {
            throw "Version '$version' is not in expected SemVer format."
          }

          $minSupportedVersion = "$($coreParts[0]).$($coreParts[1]).0"
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$installerName"

          $updateManifest = [ordered]@{
            version = $version
            url = $downloadUrl
            sha256 = $installerHash
            publishedAt = $publishedAt
            minSupportedVersion = $minSupportedVersion
          }

          $pagesRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/pages/updates"
          New-Item -ItemType Directory -Path $pagesRoot -Force | Out-Null

          $manifestFileName = if ($channel -eq 'test') { 'manifest-test.json' } else { 'manifest.json' }
          $pagesManifestPath = Join-Path $pagesRoot $manifestFileName
          $releaseManifestPath = Join-Path $packageRoot "update-$manifestFileName"

          $updateManifest | ConvertTo-Json -Depth 6 | Set-Content -Path $pagesManifestPath
          $updateManifest | ConvertTo-Json -Depth 6 | Set-Content -Path $releaseManifestPath

          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_file=$manifestFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish update manifest into docs/updates
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $defaultBranch = $env:PAGES_SOURCE_BRANCH
          $repo = $env:GITHUB_REPOSITORY
          $manifestSourceDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/pages/updates"
          $apiRoot = "https://api.github.com/repos/$repo"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "github-actions"
          }

          if (-not (Test-Path $manifestSourceDir)) {
            throw "Manifest source directory not found: $manifestSourceDir"
          }

          $updatedCount = 0

          $refResponse = Invoke-RestMethod -Uri "$apiRoot/git/ref/heads/$defaultBranch" -Headers $headers -Method Get
          $baseCommitSha = $refResponse.object.sha
          if ([string]::IsNullOrWhiteSpace($baseCommitSha)) {
            throw "Could not resolve $defaultBranch branch SHA."
          }

          $commitResponse = Invoke-RestMethod -Uri "$apiRoot/git/commits/$baseCommitSha" -Headers $headers -Method Get
          $baseTreeSha = $commitResponse.tree.sha
          if ([string]::IsNullOrWhiteSpace($baseTreeSha)) {
            throw "Could not resolve base tree SHA for $defaultBranch."
          }

          $treeEntries = @()

          foreach ($manifestFile in Get-ChildItem -Path $manifestSourceDir -Filter "*.json" -File) {
            $targetPath = "docs/updates/$($manifestFile.Name)"
            $newBytes = [System.IO.File]::ReadAllBytes($manifestFile.FullName)
            $newContentBase64 = [System.Convert]::ToBase64String($newBytes)

            $treeEntries += [ordered]@{
              path = $targetPath
              mode = "100644"
              type = "blob"
              content = [System.Text.Encoding]::UTF8.GetString($newBytes)
            }
          }

          if ($treeEntries.Count -eq 0) {
            Write-Host "No manifest files were found to publish."
            exit 0
          }

          $newTree = Invoke-RestMethod -Uri "$apiRoot/git/trees" -Headers $headers -Method Post -ContentType "application/json" -Body (@{
            base_tree = $baseTreeSha
            tree = $treeEntries
          } | ConvertTo-Json -Depth 10)

          $newCommit = Invoke-RestMethod -Uri "$apiRoot/git/commits" -Headers $headers -Method Post -ContentType "application/json" -Body (@{
            message = "chore: update release manifests for $env:GITHUB_REF_NAME"
            tree = $newTree.sha
            parents = @($baseCommitSha)
          } | ConvertTo-Json -Depth 10)

          Invoke-RestMethod -Uri "$apiRoot/git/refs/heads/$defaultBranch" -Headers $headers -Method Patch -ContentType "application/json" -Body (@{
            sha = $newCommit.sha
            force = $false
          } | ConvertTo-Json -Depth 10)

          Write-Host "Published update manifests to $defaultBranch via commit $($newCommit.sha)"

      - name: Package release artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_RUN_NUMBER" }

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\release"
          $packageRoot = Join-Path $releaseRoot "package"
          $apiDir = Join-Path $releaseRoot "api"
          $webDir = Join-Path $releaseRoot "web"
          $hostDir = Join-Path $releaseRoot "host"

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          $apiZip = "Ignyos-LanPortal-Api-$tag.zip"
          $webZip = "Ignyos-LanPortal-Web-$tag.zip"
          $hostZip = "Ignyos-LanPortal-Host-$tag.zip"

          $apiZipPath = Join-Path $packageRoot $apiZip
          $webZipPath = Join-Path $packageRoot $webZip
          $hostZipPath = Join-Path $packageRoot $hostZip

          Compress-Archive -Path (Join-Path $apiDir "*") -DestinationPath $apiZipPath -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $webDir "*") -DestinationPath $webZipPath -CompressionLevel Optimal
          if (Test-Path $hostDir) {
            Compress-Archive -Path (Join-Path $hostDir "*") -DestinationPath $hostZipPath -CompressionLevel Optimal
          }

          $apiHash = Get-FileHash -Path $apiZipPath -Algorithm SHA256
          $webHash = Get-FileHash -Path $webZipPath -Algorithm SHA256

          "$($apiHash.Hash)  $apiZip" | Set-Content -Path (Join-Path $packageRoot "$apiZip.sha256")
          "$($webHash.Hash)  $webZip" | Set-Content -Path (Join-Path $packageRoot "$webZip.sha256")

          $manifest = @(
            [PSCustomObject]@{ name = $apiZip; sha256 = $apiHash.Hash },
            [PSCustomObject]@{ name = $webZip; sha256 = $webHash.Hash }
          )

          if (Test-Path $hostZipPath) {
            $hostHash = Get-FileHash -Path $hostZipPath -Algorithm SHA256
            "$($hostHash.Hash)  $hostZip" | Set-Content -Path (Join-Path $packageRoot "$hostZip.sha256")
            $manifest += [PSCustomObject]@{ name = $hostZip; sha256 = $hostHash.Hash }
          }

          [PSCustomObject]@{
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            refName = $env:GITHUB_REF_NAME
            runId = $env:GITHUB_RUN_ID
            artifacts = $manifest
          } | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $packageRoot "release-artifacts-manifest.json")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name || github.run_number }}
          path: artifacts/release/package/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/package/*.zip
            artifacts/release/package/*.exe
            artifacts/release/package/*.sha256
            artifacts/release/package/release-artifacts-manifest.json
            artifacts/release/package/update-manifest*.json
          generate_release_notes: true
