name: Publish-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      include_host:
        description: 'Include Host publish artifact (Windows executable payload)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  publish-dev-artifacts:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      CONFIGURATION: Release
      INCLUDE_HOST: ${{ inputs.include_host }}
      DEV_PAGES_TOKEN: ${{ secrets.DEV_PAGES_TOKEN }}
      DEV_PAGES_REPO: ${{ secrets.DEV_PAGES_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Ignyos.LanPortal.sln

      - name: Publish API
        run: >
          dotnet publish
          Ignyos.LanPortal.Api/Ignyos.LanPortal.Api.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output artifacts/release/api

      - name: Publish Web
        run: >
          dotnet publish
          Ignyos.LanPortal.Web/Ignyos.LanPortal.Web.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output artifacts/release/web

      - name: Publish Host (optional)
        if: env.INCLUDE_HOST == 'true'
        run: >
          dotnet publish
          Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/release/host

      - name: Mark Host artifact as dev flavor
        if: env.INCLUDE_HOST == 'true'
        shell: pwsh
        run: |
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE "artifacts/release/host/installer-flavor.txt") -Value "dev"

      - name: Build dev installer payload
        shell: pwsh
        run: |
          $versionProjectPath = Join-Path $env:GITHUB_WORKSPACE "Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj"
          $projectXml = Get-Content -Path $versionProjectPath -Raw
          $versionMatch = [regex]::Match($projectXml, '<Version>\s*(?<version>[^<\s]+)\s*</Version>')
          if (-not $versionMatch.Success) {
            throw "Could not resolve the application version from $versionProjectPath"
          }

          $version = $versionMatch.Groups['version'].Value.Trim()
          Write-Host "Building dev installer payload for version $version"

          ./scripts/build-dev-installer.ps1 -Configuration Release -Runtime win-x64 -Version $version

          $installerRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/dev-installer"
          $installerDir = Join-Path $installerRoot "installer"
          $sitePublishRoot = Join-Path $installerRoot "site-publish"

          New-Item -ItemType Directory -Path (Join-Path $sitePublishRoot "updates") -Force | Out-Null

          $installerFile = Get-ChildItem -Path $installerDir -Filter "Ignyos-LanPortal-Dev-$version.exe" -File | Select-Object -First 1
          if ($null -eq $installerFile) {
            throw "Expected installer not found for version $version in $installerDir"
          }

          $hashFile = Join-Path $installerDir "$($installerFile.Name).sha256"
          if (-not (Test-Path $hashFile)) {
            throw "Expected checksum file not found: $hashFile"
          }

          $hashLine = (Get-Content -Path $hashFile | Select-Object -First 1).Trim()
          $sha256 = ($hashLine -split '\s+')[0]

          $releaseDir = Join-Path $sitePublishRoot "releases/$version"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -Path $installerFile.FullName -Destination (Join-Path $releaseDir $installerFile.Name) -Force
          Copy-Item -Path $hashFile -Destination (Join-Path $releaseDir "$($installerFile.Name).sha256") -Force

          $coreParts = $version -split '\.'
          $minSupportedVersion = if ($coreParts.Length -ge 3) { "$($coreParts[0]).$($coreParts[1]).$($coreParts[2])" } else { $version }
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $downloadUrl = "https://lanportal-dev.ignyos.com/releases/$version/$($installerFile.Name)"

          $manifest = [ordered]@{
            version = $version
            url = $downloadUrl
            sha256 = $sha256
            publishedAt = $publishedAt
            minSupportedVersion = $minSupportedVersion
          }

          foreach ($manifestFileName in @('manifest-test.json', 'manifest.json')) {
            $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $sitePublishRoot "updates/$manifestFileName") -Encoding utf8
          }

          Write-Host "Prepared Pages publish root at $sitePublishRoot"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-dev-artifacts-${{ github.run_number }}-${{ github.ref_name }}
          path: |
            artifacts/dev-installer/package/*
            artifacts/dev-installer/installer/*
          if-no-files-found: error

      - name: Publish dev artifacts to LAN-portal-dev repo
        if: ${{ env.DEV_PAGES_TOKEN != '' && env.DEV_PAGES_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEV_PAGES_TOKEN }}
          external_repository: ${{ secrets.DEV_PAGES_REPO }}
          publish_branch: main
          publish_dir: ${{ github.workspace }}/artifacts/dev-installer/site-publish
          force_orphan: false
          keep_files: true

      - name: Warn when dev publish target is not configured
        if: ${{ env.DEV_PAGES_TOKEN == '' || env.DEV_PAGES_REPO == '' }}
        shell: pwsh
        run: |
          Write-Host "DEV_PAGES_TOKEN or DEV_PAGES_REPO is not configured; skipping external deployment to the dev repository."
