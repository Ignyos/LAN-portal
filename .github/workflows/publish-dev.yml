name: Dev-Deploy

on:
  workflow_dispatch:
    inputs:
      include_host:
        description: 'Include Host publish artifact (Windows executable payload)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      version:
        description: 'Version for dev publish lane (suggestion: current Host version with build +1).'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-dev-artifacts:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      CONFIGURATION: Release
      INCLUDE_HOST: ${{ inputs.include_host }}
      INPUT_VERSION: ${{ inputs.version }}
      DEV_PAGES_TOKEN: ${{ secrets.DEV_PAGES_TOKEN }}
      DEV_PAGES_REPO: ${{ secrets.DEV_PAGES_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Ignyos.LanPortal.sln

      - name: Publish API
        run: >
          dotnet publish
          Ignyos.LanPortal.Api/Ignyos.LanPortal.Api.csproj
          --configuration ${{ env.CONFIGURATION }}
          -p:Version=${{ env.INPUT_VERSION }}
          -p:InformationalVersion=${{ env.INPUT_VERSION }}
          --no-restore
          --output artifacts/release/api

      - name: Publish Web
        run: >
          dotnet publish
          Ignyos.LanPortal.Web/Ignyos.LanPortal.Web.csproj
          --configuration ${{ env.CONFIGURATION }}
          -p:Version=${{ env.INPUT_VERSION }}
          -p:InformationalVersion=${{ env.INPUT_VERSION }}
          --no-restore
          --output artifacts/release/web

      - name: Publish Host (optional)
        if: env.INCLUDE_HOST == 'true'
        run: >
          dotnet publish
          Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.INPUT_VERSION }}
          -p:InformationalVersion=${{ env.INPUT_VERSION }}
          --output artifacts/release/host

      - name: Mark Host artifact as dev flavor
        if: env.INCLUDE_HOST == 'true'
        shell: pwsh
        run: |
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE "artifacts/release/host/installer-flavor.txt") -Value "dev"

      - name: Resolve publish version
        shell: pwsh
        run: |
          $requestedVersion = [string]::Empty
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $requestedVersion = $env:INPUT_VERSION.Trim()
          }

          $versionProjectPath = Join-Path $env:GITHUB_WORKSPACE "Ignyos.LanPortal.Host/Ignyos.LanPortal.Host.csproj"
          $projectXml = Get-Content -Path $versionProjectPath -Raw
          $versionMatch = [regex]::Match($projectXml, '<Version>\s*(?<version>[^<\s]+)\s*</Version>')
          if (-not $versionMatch.Success) {
            throw "Could not resolve the application version from $versionProjectPath"
          }

          $defaultVersion = $versionMatch.Groups['version'].Value.Trim()
          $version = if ([string]::IsNullOrWhiteSpace($requestedVersion)) { $defaultVersion } else { $requestedVersion }
          "resolved_version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using publish version $version"

      - name: Build dev installer payload
        shell: pwsh
        run: |
          $version = $env:resolved_version
          Write-Host "Building dev installer payload for version $version"

          ./scripts/build-dev-installer.ps1 -Configuration Release -Runtime win-x64 -Version $version

          $installerRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/dev-installer"
          $installerDir = Join-Path $installerRoot "installer"
          $sitePublishRoot = Join-Path $installerRoot "site-publish"

          New-Item -ItemType Directory -Path (Join-Path $sitePublishRoot "updates") -Force | Out-Null

          $exactInstallerName = "Ignyos-LanPortal-Dev-$version.exe"
          $installerFiles = Get-ChildItem -Path $installerDir -Filter "Ignyos-LanPortal-Dev-*.exe" -File | Sort-Object LastWriteTime -Descending
          $installerFile = $installerFiles | Where-Object { $_.Name -eq $exactInstallerName } | Select-Object -First 1
          if ($null -eq $installerFile) {
            $installerFile = $installerFiles | Select-Object -First 1
          }

          if ($null -eq $installerFile) {
            throw "Expected installer not found for version $version in $installerDir"
          }

          $effectiveVersion = $version
          if ($installerFile.BaseName -match '^Ignyos-LanPortal-Dev-(?<effectiveVersion>.+)$') {
            $effectiveVersion = $Matches['effectiveVersion']
          }

          "effective_version=$effectiveVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved effective publish version $effectiveVersion"

          $hashFile = Join-Path $installerDir "$($installerFile.Name).sha256"
          if (-not (Test-Path $hashFile)) {
            throw "Expected checksum file not found: $hashFile"
          }

          $hashLine = (Get-Content -Path $hashFile | Select-Object -First 1).Trim()
          $sha256 = ($hashLine -split '\s+')[0]

          $releaseDir = Join-Path $sitePublishRoot "releases/$effectiveVersion"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -Path $installerFile.FullName -Destination (Join-Path $releaseDir $installerFile.Name) -Force
          Copy-Item -Path $hashFile -Destination (Join-Path $releaseDir "$($installerFile.Name).sha256") -Force

          $zipName = "Ignyos-LanPortal-QA-$effectiveVersion.zip"
          $zipPath = Join-Path $releaseDir $zipName
          Compress-Archive -Path (Join-Path $releaseDir $installerFile.Name), (Join-Path $releaseDir "$($installerFile.Name).sha256") -DestinationPath $zipPath -CompressionLevel Optimal

          $coreParts = $effectiveVersion -split '\.'
          $minSupportedVersion = if ($coreParts.Length -ge 3) { "$($coreParts[0]).$($coreParts[1]).$($coreParts[2])" } else { $effectiveVersion }
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $downloadUrl = "https://lanportal-dev.ignyos.com/releases/$effectiveVersion/$($installerFile.Name)"

          $manifest = [ordered]@{
            version = $effectiveVersion
            url = $downloadUrl
            sha256 = $sha256
            publishedAt = $publishedAt
            minSupportedVersion = $minSupportedVersion
          }

          foreach ($manifestFileName in @('manifest-test.json', 'manifest.json')) {
            $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $sitePublishRoot "updates/$manifestFileName") -Encoding utf8
          }

          Write-Host "Prepared Pages publish root at $sitePublishRoot"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-dev-artifacts-${{ github.run_number }}-${{ github.ref_name }}
          path: |
            artifacts/dev-installer/package/*
            artifacts/dev-installer/installer/*
          if-no-files-found: error

      - name: Update docs release history for dev lane
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ([string]::IsNullOrWhiteSpace($env:effective_version)) { $env:resolved_version } else { $env:effective_version }
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/dev-installer"
          $installerDir = Join-Path $releaseRoot "installer"
          $installerFile = Get-ChildItem -Path $installerDir -Filter "Ignyos-LanPortal-Dev-$version.exe" -File | Select-Object -First 1
          if ($null -eq $installerFile) {
            throw "Expected installer not found for version $version"
          }

          $checksumFile = Join-Path $installerDir "$($installerFile.Name).sha256"
          if (-not (Test-Path $checksumFile)) {
            throw "Expected checksum file not found: $checksumFile"
          }

          $zipName = "Ignyos-LanPortal-QA-$version.zip"
          $historyPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/history.json"
          $history = @()
          if (Test-Path $historyPath) {
            $history = Get-Content -Path $historyPath -Raw | ConvertFrom-Json
          }

          $historyEntry = [ordered]@{
            version = $version
            lane = 'dev'
            installerUrl = "https://lanportal-dev.ignyos.com/releases/$version/$($installerFile.Name)"
            checksumUrl = "https://lanportal-dev.ignyos.com/releases/$version/$($installerFile.Name).sha256"
            zipUrl = "https://lanportal-dev.ignyos.com/releases/$version/$zipName"
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          }

          $existing = @($history | Where-Object { $_.version -ne $version -or $_.lane -ne 'dev' })
          $existing += [PSCustomObject]$historyEntry
          $existing | Sort-Object { $_.version } | ConvertTo-Json -Depth 6 | Set-Content -Path $historyPath -Encoding utf8

          Write-Host "Updated docs release history at $historyPath"

          $sitePublishRoot = Join-Path $releaseRoot "site-publish"
          $siteReleasesRoot = Join-Path $sitePublishRoot "releases"
          New-Item -ItemType Directory -Path $siteReleasesRoot -Force | Out-Null

          $releasesIndexSource = Join-Path $env:GITHUB_WORKSPACE "docs/releases/index.html"
          if (Test-Path $releasesIndexSource) {
            Copy-Item -Path $releasesIndexSource -Destination (Join-Path $siteReleasesRoot "index.html") -Force
          }

          Copy-Item -Path $historyPath -Destination (Join-Path $siteReleasesRoot "history.json") -Force
          Write-Host "Added releases page assets to site publish payload at $siteReleasesRoot"

      - name: Publish dev artifacts to LAN-portal-dev repo
        if: ${{ env.DEV_PAGES_TOKEN != '' && env.DEV_PAGES_REPO != '' }}
        shell: pwsh
        env:
          DEV_PAGES_TOKEN: ${{ secrets.DEV_PAGES_TOKEN }}
          DEV_PAGES_REPO: ${{ secrets.DEV_PAGES_REPO }}
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/dev-installer/site-publish"
          if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found: $publishDir"
          }

          if ([string]::IsNullOrWhiteSpace($env:DEV_PAGES_TOKEN) -or [string]::IsNullOrWhiteSpace($env:DEV_PAGES_REPO)) {
            Write-Host "DEV_PAGES_TOKEN or DEV_PAGES_REPO is not configured; skipping external deployment to the dev repository."
            exit 0
          }

          $repoDir = Join-Path $env:RUNNER_TEMP "lanportal-dev-site"
          if (Test-Path $repoDir) {
            Remove-Item -Recurse -Force $repoDir
          }

          New-Item -ItemType Directory -Path $repoDir -Force | Out-Null
          $repoUrl = "https://x-access-token:$($env:DEV_PAGES_TOKEN)@github.com/$($env:DEV_PAGES_REPO).git"

          git clone --depth 1 --branch main $repoUrl $repoDir

          Push-Location $repoDir
          try {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Keep the existing site shell (index/app assets) and update only release payload + manifests.
            foreach ($targetRoot in @($repoDir, (Join-Path $repoDir "docs"))) {
              New-Item -ItemType Directory -Path (Join-Path $targetRoot "releases") -Force | Out-Null
              New-Item -ItemType Directory -Path (Join-Path $targetRoot "updates") -Force | Out-Null

              Copy-Item -Path (Join-Path $publishDir "releases\*") -Destination (Join-Path $targetRoot "releases") -Recurse -Force
              Copy-Item -Path (Join-Path $publishDir "updates\*") -Destination (Join-Path $targetRoot "updates") -Recurse -Force
            }

            if (Test-Path (Join-Path $repoDir "CNAME")) {
              Copy-Item -Path (Join-Path $repoDir "CNAME") -Destination (Join-Path $repoDir "docs/CNAME") -Force
            }

            git add --all
            $changes = git status --porcelain
            if ([string]::IsNullOrWhiteSpace($changes)) {
              Write-Host "No changes to publish."
              exit 0
            }

            git commit -m "deploy: ${{ github.repository }}@${{ github.sha }}"
            git fetch origin main
            git push origin HEAD:main --force
          }
          finally {
            Pop-Location
          }

      - name: Warn when dev publish target is not configured
        if: ${{ env.DEV_PAGES_TOKEN == '' || env.DEV_PAGES_REPO == '' }}
        shell: pwsh
        run: |
          Write-Host "DEV_PAGES_TOKEN or DEV_PAGES_REPO is not configured; skipping external deployment to the dev repository."
